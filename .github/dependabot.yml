# Dependabot opens pull requests when dependencies have updates or security
# fixes. Each PR runs through CI before anything is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    # Stay on the Node.js LTS line. Patch/minor updates (security fixes) still
    # arrive automatically; moving to the next LTS major is a deliberate change.
    # Example: PR #1 proposed node:25-alpine (non-LTS, end-of-life) and failed
    # the image vulnerability scan with 4 HIGH OpenSSL CVEs.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/envs/dev
    schedule:
      interval: weekly
